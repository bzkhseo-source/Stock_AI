# Render Blueprint: 대시보드 → New → Blueprint → 이 저장소 선택
# DATABASE_URL, INVITE_CODES 는 배포할 때 Render 화면에서 직접 입력합니다 (저장소에 넣지 않음).
services:
  - type: web
    name: waeollatji
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: INVITE_CODES
        sync: false
