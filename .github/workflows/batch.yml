# 배치 작업을 GitHub Actions 예약 실행으로 돌린다 (무료 PaaS의 유휴 정지 문제 회피).
# 저장소 Settings → Secrets and variables → Actions 에 아래 값을 등록하세요:
#   DATABASE_URL, DART_API_KEY, KRX_ID, KRX_PW, GEMINI_API_KEY
# 비공개 저장소는 Actions 무료 사용 시간 한도가 있으니 사용량을 확인하세요.
name: batch

on:
  schedule:
    - cron: "40 7 * * 1-5"      # 평일 16:40 KST 장 마감 후 일일 배치
    - cron: "17 0-14/1 * * 1-5" # 평일 09:17~23:17 KST 매시 뉴스 수집
  workflow_dispatch:
    inputs:
      command:
        description: "실행할 명령 (daily / news / analyze / verify / backfill)"
        default: daily
        type: choice
        options: [daily, backfill, news, analyze, verify]
concurrency:
  group: batch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 명령 결정
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "c=${{ inputs.command }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "40 7 * * 1-5" ]; then echo "c=daily" >> $GITHUB_OUTPUT
          else echo "c=news" >> $GITHUB_OUTPUT; fi
      - run: python -m jobs.run ${{ steps.cmd.outputs.c }}
